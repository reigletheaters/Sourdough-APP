      <h1 class="section-title reveal">Meet Mariah</h1>
      <p class="section-sub reveal">A one-woman bakery, a wild starter, and a stubborn belief that bread should be made of bread.</p>
      <div class="story-grid">
        <div class="story-photo reveal"><img src="mariah.jpg" alt="Mariah at home with her puppy"></div>
        <div class="reveal">
          <h2>The story</h2>
          <p>I started baking sourdough a few years ago after I couldn't find a single loaf at the grocery store that didn't list ingredients I didn't recognize. I figured I'd try making my own. One loaf turned into two, then ten, then a wait list of friends and neighbors asking for more.</p>
          <p>Mariah's Sourdough Co. grew out of that — quietly, one bake at a time. Today every loaf is still shaped, scored, and baked by me.</p>
          <h2 class="mt-28">What goes into the bread</h2>
          <p>Three ingredients. That's the whole list:</p>
          <ul>
            <li><strong>Certified-organic flour.</strong></li>
            <li><strong>Filtered water.</strong></li>
            <li><strong>Good-quality natural salt.</strong></li>
          </ul>
          <p>That's it. No commercial yeast, no dough conditioners, no preservatives, no enrichers, no oils, no sugars (unless the recipe specifically calls for it, like the cinnamon raisin). The fermentation does all the work — and it takes its time.</p>
          <div class="tag-row">
            <span class="tag">100% Organic</span><span class="tag">No Preservatives</span><span class="tag">No Commercial Yeast</span><span class="tag">Small-Batch</span><span class="tag">Hand-Shaped</span>
          </div>
        </div>
      </div>
    </section>

        <p class="prose-center reveal">Real bread used to be a staple — something that nourished a family for the week. Somewhere along the way it became fluffy, fast, and full of things our bodies don't recognize. I bake the way bakers have for thousands of years because that's the version of bread your body actually knows how to use. And honestly? It just tastes better.</p>
        <div class="center mt-30 reveal">

  <template id="view-why">
    <section class="container">
      <h1 class="section-title reveal">Why Sourdough Bread?</h1>
      <p class="section-sub reveal">Same grain. Different process. A very different loaf.</p>
      <p class="prose-center mb-40 reveal">Conventional bread is mixed, risen, and baked in a few hours using fast commercial yeast. Sourdough is fermented slowly — sometimes 24 to 48 hours — by a wild culture of natural yeasts and bacteria. That long, slow ferment changes the bread itself, in ways your body notices.</p>
      <div class="benefit-grid">
        <div class="benefit-card reveal"><span class="benefit-icon">🌾</span><h3>Easier to digest</h3><p>The wild bacteria in a sourdough starter pre-digest much of the gluten and starch during fermentation. Many people who feel uncomfortable after regular bread find sourdough far easier on their stomach.</p></div>
        <div class="benefit-card reveal"><span class="benefit-icon">💪</span><h3>More nutrients absorbed</h3><p>Whole grains contain phytic acid, which can block your body from absorbing minerals like iron, zinc, and magnesium. Sourdough fermentation breaks phytic acid down — meaning more of those nutrients actually reach you.</p></div>
        <div class="benefit-card reveal"><span class="benefit-icon">📉</span><h3>Lower glycemic impact</h3><p>Sourdough produces a slower, gentler rise in blood sugar than commercial bread. Steadier energy, fewer crashes, and a friendlier loaf for anyone watching glucose levels.</p></div>
        <div class="benefit-card reveal"><span class="benefit-icon">🦠</span><h3>Good for gut health</h3><p>The lactic acid bacteria in fermentation produce prebiotic compounds that feed the beneficial microbes already living in your gut — supporting a healthier microbiome with every slice.</p></div>
        <div class="benefit-card reveal"><span class="benefit-icon">🧪</span><h3>No mystery ingredients</h3><p>True sourdough needs only flour, water, and salt. No dough conditioners, no preservatives, no added sugars, no emulsifiers — just bread, the way it's been made for thousands of years.</p></div>
        <div class="benefit-card reveal"><span class="benefit-icon">⏳</span><h3>Stays fresh, naturally</h3><p>The natural acidity of sourdough acts as a built-in preservative. Loaves stay fresh longer without a single additive — because fermentation is doing the work that chemicals do in supermarket bread.</p></div>
        <div class="benefit-card reveal"><span class="benefit-icon">🍞</span><h3>Naturally lower in gluten</h3><p>While sourdough is not gluten-free, the long fermentation breaks down a significant portion of the gluten proteins, often making it tolerable for people sensitive to (but not allergic to) wheat.</p></div>
        <div class="benefit-card reveal"><span class="benefit-icon">😋</span><h3>It just tastes better</h3><p>That tangy depth, the chewy crumb, the crackling crust — none of it is engineered. It's the byproduct of slow fermentation. Real flavor is what happens when bread is given time.</p></div>
      </div>
      <div class="center mt-50 reveal"><a class="btn" href="#/shop" data-link>Try a loaf for yourself</a></div>
    </section>
    <section class="band">
      <div class="container pv-40">
        <p class="disclaimer">These descriptions reflect general nutritional research about sourdough fermentation. They are not medical advice — if you have a wheat allergy, celiac disease, or specific dietary needs, please consult your doctor.</p>
      </div>
    </section>
